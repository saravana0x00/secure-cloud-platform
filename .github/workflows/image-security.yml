name: Image Security

on:
  push:
    branches: [main]
  pull_request:

jobs:
  image-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the image
        run: docker build -t sample-app:ci app

      - name: Fail on fixable HIGH or CRITICAL vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb image --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 sample-app:ci

      - name: Generate the SBOM
        run: |
          mkdir sbom
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD":/work -w /work aquasec/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb image \
            --format cyclonedx --output sbom/sample-app.cdx.json sample-app:ci

      - name: Upload the SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sample-app-sbom
          path: sbom/sample-app.cdx.json