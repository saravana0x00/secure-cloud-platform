name: Security Scan

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checkov:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Checkov
        run: pip install checkov

      - name: Scan Terraform code
        run: checkov -d terraform --compact --quiet

  conftest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Real manifests must pass the policy
        run: |
          docker run --rm -v "$PWD":/project -w /project openpolicyagent/conftest@sha256:0e77cdf7c1fcde035f3c579e4aaa6664ee2a8be5777eaa9af9f520cdd02280c0 \
            test --policy policy-as-code/kubernetes kubernetes/hardening

      - name: Insecure demo must be rejected by the policy
        run: |
          if docker run --rm -v "$PWD":/project -w /project openpolicyagent/conftest@sha256:0e77cdf7c1fcde035f3c579e4aaa6664ee2a8be5777eaa9af9f520cdd02280c0 \
            test --policy policy-as-code/kubernetes kubernetes/demo-insecure; then
            echo "ERROR: the insecure demo pod passed the policy, so the policy is broken"
            exit 1
          fi
          echo "OK: the insecure demo pod was rejected, as expected"