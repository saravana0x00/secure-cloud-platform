name: Security Scan

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checkov:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Checkov
        run: pip install checkov

      - name: Scan Terraform code
        run: checkov -d terraform --compact --quiet

  conftest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Real manifests must pass the policy
        run: |
          docker run --rm -v "$PWD":/project -w /project openpolicyagent/conftest \
            test --policy policy-as-code/kubernetes kubernetes/hardening

      - name: Insecure demo must be rejected by the policy
        run: |
          if docker run --rm -v "$PWD":/project -w /project openpolicyagent/conftest \
            test --policy policy-as-code/kubernetes kubernetes/demo-insecure; then
            echo "ERROR: the insecure demo pod passed the policy, so the policy is broken"
            exit 1
          fi
          echo "OK: the insecure demo pod was rejected, as expected"