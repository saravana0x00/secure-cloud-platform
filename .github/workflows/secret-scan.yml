name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Scan the repository history for secrets
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD":/repo \
            zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo

      - name: Self-test, the scanner must catch a fake token
        run: |
          # The fake token is assembled at runtime, so no token-shaped text is stored in the repository
          PREFIX="ghp_"
          BODY="R8kQ2mXv7LzP4nWc9TbYd3HsJf6AgEu1NoXi"
          mkdir "$RUNNER_TEMP/selftest"
          echo "github_token = ${PREFIX}${BODY}" > "$RUNNER_TEMP/selftest/fake.txt"
          if docker run --rm --user "$(id -u):$(id -g)" -v "$RUNNER_TEMP/selftest":/scan \
            zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f dir /scan; then
            echo "ERROR: the scanner missed a fake token, so secret scanning is broken"
            exit 1
          fi
          echo "OK: the scanner caught the fake token, as expected"